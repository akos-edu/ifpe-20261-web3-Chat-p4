spring.application.name=chatWeb

# Banco de dados H2 em arquivo (persiste cadastro de alunos entre reinicios)
spring.datasource.url=jdbc:h2:file:./data/chatwebdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=8080
